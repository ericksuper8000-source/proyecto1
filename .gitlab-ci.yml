# Validation-only pipeline. GitLab is the mirror repository (storage);
# image publishing to the 3 registries happens ONLY in GitHub Actions (ADR-0007).

stages:
  - lint
  - test
  - security

lint:
  stage: lint
  image: python:3.11
  script:
    - pip install flake8 black ruff mypy
    - flake8 .
    - black --check .
    - ruff check .
    - mypy .

test:
  stage: test
  image: python:3.11
  script:
    - pip install -r requirements.txt
    - pytest

security:
  stage: security
  image: python:3.11
  script:
    - pip install bandit pip-audit
    - bandit -r . -x "./__pycache__,./test_principal.py"
    - pip-audit -r requirements.txt
