services:
  app:
    # :latest deliberado SOLO en local: Watchtower debe detectar la imagen nueva
    # para simular CD (ADR-0004). En el VPS (Fase 11) se fija la etiqueta del commit.
    image: erickdev8/mi-app:latest
    container_name: mi_app_container
    restart: always

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.41
    command: --interval 30